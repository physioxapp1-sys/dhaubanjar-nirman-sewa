---
# NOT the active deploy path. The app is a plain `git clone` directly at
# /home2/madhyapu/dhaubanjar-nirman-sewa (not inside cPanel's Git Version
# Control "repositories/" folder - that folder's tighter permissions
# silently blocked LiteSpeed's Passenger worker from ever starting).
# Deploys happen via `git pull` there, using deploy.sh as the post-merge
# hook. This file is kept only in case Git Version Control is used again
# for something else later.
deployment:
  tasks:
    - export APPROOT=/home2/madhyapu/dhaubanjar-nirman-sewa
    - export VENVPY=/home2/madhyapu/virtualenv/dhaubanjar-nirman-sewa/3.11/bin/python
    - cd $APPROOT && $VENVPY manage.py collectstatic --noinput
    - cd $APPROOT && $VENVPY manage.py migrate --noinput
    - /bin/mkdir -p $APPROOT/tmp
    - /usr/bin/touch $APPROOT/tmp/restart.txt
